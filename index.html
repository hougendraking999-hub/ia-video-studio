<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>IA Video Studio by Hougendra</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#0f111a;color:#fff;display:flex;min-height:100vh}
.left{width:50%;padding:24px;background:#161a2a}
.right{width:50%;background:#000;display:flex;align-items:center;justify-content:center;height:100vh}
input,select{width:100%;padding:12px;background:#1f2540;border:1px solid #2a335a;border-radius:10px;color:#fff;margin-bottom:10px}
.row{display:flex;gap:10px}.row>div{flex:1}
.btn-main{width:100%;padding:14px;background:#fff;color:#000;border-radius:30px;font-weight:800;border:0;cursor:pointer;margin-top:12px}
.result-box{background:#1f2540;border-radius:14px;padding:14px;margin-top:14px;font-size:13px;line-height:1.5}
#preview{max-width:100%;max-height:100%;border-radius:12px;display:none}
</style>
</head>
<body>
<div class="left">
<h1>IA Video Studio by Hougendra</h1>
<p style="color:#888;font-size:12px;margin:10px 0">Subject + Action + Environment + Camera + Movement + Lighting + Mood</p>
<input id="subject" value="A fox, bunny and monkey">
<input id="action" value="finding a glowing treasure map">
<input id="env" value="in a magical misty jungle">
<div class="row"><div><select id="camera"><option>low tracking perspective</option></select></div><div><select id="move"><option>gradual push-in</option></select></div></div>
<div class="row"><div><select id="light"><option>warm golden-hour light</option></select></div><div><select id="mood"><option>adventurous and joyful</option></select></div></div>
<button class="btn-main" onclick="buildPrompt()">Build Final Prompt</button>
<div id="out" class="result-box" style="display:none"><div id="finalText"></div><br><button onclick="copyPrompt()">Copy</button> <button onclick="generate()" style="background:#00d1ff;padding:6px 14px;border-radius:20px;border:0;font-weight:700">Generate ✨</button></div>
</div>
<div class="right"><div id="loader">Preview will appear here</div><img id="preview" /></div>
<script>
let lastPrompt="";
function buildPrompt(){
 let s=document.getElementById('subject').value;
 let a=document.getElementById('action').value;
 let e=document.getElementById('env').value;
 let c=document.getElementById('camera').value;
 let m=document.getElementById('move').value;
 let l=document.getElementById('light').value;
 let mo=document.getElementById('mood').value;
 lastPrompt=`${s} ${a} ${e}, filmed from a ${c}, with a ${m}, ${l}, ${mo} mood, pixar 3d kids cartoon, 4k`;
 document.getElementById('finalText').innerText=lastPrompt;
 document.getElementById('out').style.display='block';
}
function copyPrompt(){navigator.clipboard.writeText(lastPrompt);alert('Copied!');}
async function generate(){
 if(!lastPrompt){buildPrompt();}
 document.getElementById('loader').innerText='Generating... 5 sec...';
 let url=`https://image.pollinations.ai/prompt/${encodeURIComponent(lastPrompt)}?width=1024&height=1024&nologo=true&seed=${Date.now()}`;
 let img=document.getElementById('preview');
 img.onload=()=>{document.getElementById('loader').style.display='none';img.style.display='block';};
 img.src=url;
}
</script>
</body>
</html>
