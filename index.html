<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0a0a0a">
  <title>Hougendra King Cobra</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #0a0a0a; color: #fff; font-family: Arial, sans-serif; }
    header { position: sticky; top: 0; z-index: 1; display: flex; align-items: center; gap: 10px; padding: 12px; background: #111; border-bottom: 1px solid #d4af37; }
    .logo { width: 40px; height: 40px; flex: 0 0 40px; display: grid; place-items: center; border-radius: 50%; background: #ffd700; color: #000; font-weight: 900; }
    main { width: min(100%, 650px); margin: auto; padding: 12px; }
    .card, .post { margin-bottom: 12px; padding: 14px; border: 1px solid #333; border-radius: 12px; background: #1a1a1a; }
    input, textarea { width: 100%; margin: 6px 0; padding: 12px; border: 1px solid #444; border-radius: 8px; background: #111; color: #fff; font: inherit; }
    textarea { min-height: 100px; resize: vertical; }
    button { width: 100%; margin-top: 8px; padding: 12px; border: 0; border-radius: 9px; background: #ffd700; color: #000; font-weight: 900; cursor: pointer; }
    button:hover { background: #e6c200; }
    .delete { width: auto; padding: 7px 10px; background: #382020; color: #fff; }
    .meta { color: #aaa; font-size: 12px; }
    .post-text { margin-top: 10px; white-space: pre-wrap; overflow-wrap: anywhere; }
    .empty { padding: 20px; color: #aaa; text-align: center; }
    .notice { color: #aaa; font-size: 12px; line-height: 1.5; }
  </style>
</head>
<body>
  <header>
    <div class="logo" aria-hidden="true">KC</div>
    <strong>HOUGENDRA <span style="color:#ffd700">KING COBRA</span></strong>
  </header>

  <main>
    <section class="card">
      <label for="name">Your name</label>
      <input id="name" maxlength="40" placeholder="Enter your name">

      <label for="text">Your post</label>
      <textarea id="text" maxlength="1000" placeholder="What’s happening?"></textarea>

      <button id="postButton" type="button">POST</button>
      <p class="notice">Posts are stored only in this browser on this device. They are not shared with other visitors.</p>
    </section>

    <section id="feed" aria-live="polite"></section>
  </main>

  <script>
    "use strict";

    const STORAGE_KEY = "hougendra_king_cobra_posts_v1";
    const nameInput = document.getElementById("name");
    const textInput = document.getElementById("text");
    const feed = document.getElementById("feed");

    function readPosts() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY) || "[]");
        return Array.isArray(saved) ? saved : [];
      } catch {
        return [];
      }
    }

    function savePosts(posts) {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(posts));
    }

    function renderPosts() {
      const posts = readPosts();
      feed.replaceChildren();

      if (posts.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No posts yet. Write the first one!";
        feed.appendChild(empty);
        return;
      }

      posts.forEach((post) => {
        const article = document.createElement("article");
        article.className = "post";

        const heading = document.createElement("strong");
        heading.textContent = "🐍 " + post.name;

        const time = document.createElement("div");
        time.className = "meta";
        time.textContent = post.time;

        const content = document.createElement("div");
        content.className = "post-text";
        content.textContent = post.text;

        const remove = document.createElement("button");
        remove.className = "delete";
        remove.type = "button";
        remove.textContent = "Delete";
        remove.addEventListener("click", () => {
          savePosts(readPosts().filter((item) => item.id !== post.id));
          renderPosts();
        });

        article.append(heading, time, content, remove);
        feed.appendChild(article);
      });
    }

    document.getElementById("postButton").addEventListener("click", () => {
      const name = nameInput.value.trim().slice(0, 40) || "KING";
      const text = textInput.value.trim();

      if (!text) {
        alert("Please write something first.");
        textInput.focus();
        return;
      }

      const posts = readPosts();
      posts.unshift({
        id: crypto.randomUUID ? crypto.randomUUID() : String(Date.now()),
        name,
        text: text.slice(0, 1000),
        time: new Date().toLocaleString()
      });

      try {
        savePosts(posts);
        textInput.value = "";
        renderPosts();
      } catch {
        alert("Could not save the post. Check your browser storage settings.");
      }
    });

    renderPosts();
  </script>
</body>
</html>
