<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>AI Video Studio - By HOUGENDRA</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}body{background:#050507;color:#fff}.top{padding:14px;text-align:center;border-bottom:1px solid #222}.top b span{color:#7c5cff}.wrap{max-width:900px;margin:0 auto;padding:12px;display:grid;grid-template-columns:340px 1fr;gap:12px}@media(max-width:800px){.wrap{grid-template-columns:1fr}}.card{background:#0f0f12;border:1px solid #222;border-radius:16px;padding:14px}textarea,select{width:100%;background:#000;border:1px solid #333;border-radius:10px;color:#fff;padding:10px;margin-top:4px}.btn{width:100%;padding:13px;border:none;border-radius:12px;font-weight:900;cursor:pointer;margin-top:10px}.gen{background:#7c5cff;color:#fff}.scene{background:#000;border:1px solid #333;border-radius:12px;padding:8px;margin-top:8px}.scene img{width:100%;border-radius:8px}video{width:100%;border-radius:12px;margin-top:10px}</style></head><body><div class="top"><b>AI VIDEO STUDIO <span>By HOUGENDRA</span></b><div style="font-size:11px;color:#888">100% FREE - hougendraking999-hub</div></div><div class="wrap"><div class="card"><textarea id="prompt" rows="4" placeholder="Fox bunny monkey pirate treasure kids cartoon 3d pixar"></textarea><button class="btn gen" onclick="generate()">🚀 GENERATE REAL VIDEO - FREE</button><div id="status" style="font-size:11px;color:#ff0;margin-top:8px">Ready...</div></div><div class="card"><div id="script" style="font-size:12px;background:#000;border:1px solid #222;border-radius:10px;padding:10px">Script yaha ayega...</div><div id="scenes"></div><video id="vid" controls style="display:none"></video><a id="dl" style="display:none" class="btn gen">⬇ DOWNLOAD</a></div></div><script>async function generate(){let p=document.getElementById('prompt').value; if(!p) return alert('Prompt likho!'); document.getElementById('status').innerText='Generating AI images...'; let pr=[`planning table ${p} 3d pixar cartoon`,`sailing ship ${p} 3d cartoon`,`hiding barrels ${p} 3d cartoon`,`treasure chest glow ${p} 3d cartoon`,`celebration ship ${p} 3d cartoon`]; let box=document.getElementById('scenes'); box.innerHTML=''; let urls=[]; for(let i=0;i<pr.length;i++){let d=document.createElement('div'); d.className='scene'; d.innerHTML=`<b>Scene ${i+1}</b><p>Loading...</p>`; box.appendChild(d); let u=`https://image.pollinations.ai/prompt/${encodeURIComponent(pr[i])}?width=720&height=1280&nologo=true&seed=${Date.now()+i}`; urls.push(u); let im=new Image(); im.crossOrigin='anonymous'; im.src=u; await new Promise(r=>{im.onload=r; setTimeout(r,800);}); d.innerHTML=`<b>Scene ${i+1}</b><img src="${u}">`;} document.getElementById('status').innerText='Rendering video...'; let c=document.createElement('canvas'); c.width=720; c.height=1280; let x=c.getContext('2d'); let s=c.captureStream(30); let r=new MediaRecorder(s); let ch=[]; r.ondataavailable=e=>ch.push(e.data); r.onstop=()=>{let b=new Blob(ch,{type:'video/webm'}); let U=URL.createObjectURL(b); document.getElementById('vid').src=U; document.getElementById('vid').style.display='block'; document.getElementById('dl').href=U; document.getElementById('dl').style.display='block'; document.getElementById('status').innerText='✅ VIDEO READY!';}; let ims=[]; for(let u of urls){let im=new Image(); im.crossOrigin='anonymous'; im.src=u; await new Promise(r=>{im.onload=r; im.onerror=r;}); ims.push(im);} r.start(); let k=0; let it=setInterval(()=>{try{x.drawImage(ims[k%ims.length],0,0,720,1280);}catch{} k++; if(k>12){clearInterval(it); r.stop();}},900);}</script></body></html>
