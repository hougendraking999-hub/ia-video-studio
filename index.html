<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>FLOW LABS</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-black text-white"><header class="p-4 border-b border-zinc-800"><b>FLOW LABS by Hougendra</b> <span class="text-xs text-zinc-500 ml-2">8 Layer Prompt System</span></header><div class="max-w-5xl mx-auto p-4 grid md:grid-cols-2 gap-4"><div class="bg-zinc-900 rounded-2xl p-4"><p class="text-xs text-zinc-500 mb-2">Subject + Action + Environment + Camera + Movement + Lighting + Mood</p><input id="subject" class="w-full bg-zinc-800 rounded p-2 text-sm mb-2" value="A fox, bunny and monkey" placeholder="Subject"><input id="action" class="w-full bg-zinc-800 rounded p-2 text-sm mb-2" value="finding a glowing treasure map" placeholder="Action"><input id="env" class="w-full bg-zinc-800 rounded p-2 text-sm mb-2" value="in a magical misty jungle" placeholder="Environment"><div class="grid grid-cols-2 gap-2 mb-2"><select id="camera" class="bg-zinc-800 rounded p-2 text-sm"><option>low tracking perspective</option><option>wide angle</option><option>close-up</option></select><select id="move" class="bg-zinc-800 rounded p-2 text-sm"><option>gradual push-in</option><option>tracking forward</option></select></div><div class="grid grid-cols-2 gap-2 mb-3"><select id="light" class="bg-zinc-800 rounded p-2 text-sm"><option>warm golden-hour light</option><option>magical glow</option></select><select id="mood" class="bg-zinc-800 rounded p-2 text-sm"><option>adventurous and joyful</option><option>magical</option></select></div><button onclick="build()" class="w-full bg-white text-black py-3 rounded-full text-sm font-bold">✨ Build Final Prompt</button><div class="mt-3 bg-black border border-zinc-800 rounded-xl p-3"><p id="final" class="text-sm">Click Build...</p><div class="flex gap-2 mt-2"><button onclick="navigator.clipboard.writeText(document.getElementById('final').innerText);alert('Copied!')" class="text-xs bg-zinc-800 px-3 py-1 rounded-full">Copy</button><button onclick="gen()" class="text-xs bg-blue-600 px-3 py-1 rounded-full">Generate</button></div></div></div><div class="bg-zinc-900 rounded-2xl p-4"><div id="preview" class="aspect-[9/16] bg-black rounded-xl flex items-center justify-center text-xs text-zinc-600">Preview</div><div id="list" class="grid grid-cols-3 gap-2 mt-2"></div></div></div><script>function build(){let f=`${subject.value} ${action.value} ${env.value}, filmed from a ${camera.value}, with a ${move.value}, ${light.value}, shallow depth of field, ${mood.value} mood, pixar 3d kids cartoon, 4k`;final.innerText=f;return f}function gen(){let p=build();preview.innerHTML='Generating...';list.innerHTML='';[1,2,3].forEach(i=>{let u=`https://image.pollinations.ai/prompt/${encodeURIComponent(p+' scene '+i)}?width=720&height=1280&seed=${Date.now()+i*50}`;list.innerHTML+=`<img src="${u}" class="rounded-lg">`;if(i==1)preview.innerHTML=`<img src="${u}" class="w-full h-full object-cover rounded-xl">`})}</script></body></html>
